name: Scraper CI

on:
  push:
    branches: [main, Development]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      BACKEND_API_URL: http://localhost:8001
      SCRAPER_API_KEY: ci-test-scraper-key
      GEOCODING_USER_AGENT: findyourbuddy-ci/0.1 (ci@findyourbuddy.test)
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run tests
        run: uv run pytest -q

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Export locked dependencies
        run: uv export --frozen --no-hashes --no-emit-project -o requirements-audit.txt

      - name: Scan dependencies for known CVEs
        run: uvx pip-audit -r requirements-audit.txt
