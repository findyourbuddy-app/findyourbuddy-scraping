[project]
name = "findyourbuddy-scraper"
version = "0.1.0"
description = "findyourbuddy-backend icin etkinlik verisi ceken bagimsiz scraper servisi"
requires-python = ">=3.11"
dependencies = [
    "pydantic==2.9.2",
    "pydantic-settings==2.5.2",
    "httpx==0.27.2",
    "beautifulsoup4==4.12.3",
    "apscheduler==3.10.4",
    "tenacity==9.0.0",
]

[dependency-groups]
dev = [
    "pytest==8.3.3",
    "respx==0.21.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
