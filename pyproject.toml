[project]
name = "findyourbuddy-scraper"
version = "0.1.0"
description = "findyourbuddy-backend icin etkinlik verisi ceken bagimsiz scraper servisi"
requires-python = ">=3.11"
dependencies = [
    "pydantic==2.13.4",
    "pydantic-settings==2.15.0",
    "httpx==0.28.1",
    "beautifulsoup4==4.15.0",
    "apscheduler==3.11.3",
    "tenacity==9.1.4",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "respx==0.23.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
